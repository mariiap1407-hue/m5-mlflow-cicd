name: CI/CD

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db
      USE_REGISTRY: "false"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Entrainer le modele
        run: python train_model.py

      - name: Executer les tests
        run: pytest tests/ -v -s

      - name: Faire remonter le modele
        uses: actions/upload-artifact@v7
        with:
          name: model
          path: model/
  
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Recuperer le modele entraine
        uses: actions/download-artifact@v7
        with:
          name: model
          path: model/

      - uses: docker/setup-buildx-action@v4

      - name: Authentification sur ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et pousser l'image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/diabetes-api:latest

      - name: Smoke test sur l'image poussee
        run: |
          docker run -d -p 8000:8000 --name api-test ghcr.io/${{ github.repository }}/diabetes-api:latest
          sleep 15
          curl --fail http://localhost:8000/health
          docker stop api-test